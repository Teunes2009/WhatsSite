services:
  WhatsSite:
    build: .
    volumes:
      - data:/app/data
    networks:
      - web
    environment:
      - FORWARDED_ALLOW_IPS=*
    labels:
      - traefik.enable=true
      - traefik.http.routers.WhatsSite.rule=Host(`${DOMEIN:-161.35.150.139.nip.io}`)
      - traefik.http.services.WhatsSite.loadbalancer.server.port=8000
      - traefik.http.routers.WhatsSite.middlewares=hsts
      - traefik.http.middlewares.hsts.headers.stsSeconds=86400
    restart: unless-stopped

volumes:
  data:

networks:
  web:
    external: true