<!DOCTYPE html>
<html>
    <head>
        <title>Home</title>
        <link rel="stylesheet" href="/static/css/style.css">
        <script src="/static/js/app.js" defer></script>
    </head>
    <body>
        <nav>
            <a href="/">Home</a> | <a href="/about">Over Mij</a> | <a href="/project">Project</a>
        </nav>
        <h1>Hallo, {{ naam }}!</h1>
        <p>Dit zijn uw chats:</p>
            {% if Messages %}
                <ul>
                {% for ChatName in Messages %}
                    <li><a href="/Chats/{{ ChatName }}">{{ ChatName }}</a></li>
                {% endfor %}
                </ul>
            {% else %}
                <h3>Geen berichten gevonden.</h3>
            {% endif %}
    </body>
</html>
