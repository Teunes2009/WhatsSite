<!DOCTYPE html>
<html>
    <head>
        <title>Home</title>
        <link rel="stylesheet" href="/static/css/style.css">
        <script src="/static/js/app.js" defer></script>
    </head>
    <body>
        <nav>
            <a href="/">Home</a> | <a href="/about">Over Mij</a> | <a href="/project">Project</a>
        </nav>
        <h1>Adminpaneel</h1>
        <p>Dit zijn de gebruikers en hun wachtwoorden.</p>
            {% if info %}
                <ul>
                {% for persoon, wachtwoord in info %}
                    <li>{{ persoon }}: Wachtwoord: {{ wachtwoord.wachtwoord }}</li>
                {% endfor %}
                </ul>
            {% else %}
                <h3>Nog geen gebruikers.</h3>
            {% endif %}
    </body>
</html>
