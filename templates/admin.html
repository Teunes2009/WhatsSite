<!DOCTYPE html>
<html>
    <head>
        <title>Home</title>
        <link rel="stylesheet" href="/static/css/style.css">
        <script src="/static/js/app.js" defer></script>
    </head>
    <body>
        <nav>
            <a href="/">Home</a> | <a href="/about">Over Mij</a> | <a href="/project">Project</a>
        </nav>
        <h1>Adminpaneel</h1>
        <p>Dit zijn alle chats:</p>
        <div id="ChatList" hx-post="/GetAllChats" hx-trigger="every 2s, visibilitychange from:body" hx-vals='{"Name":"{{ naam }}", "Password":"{{ wachtwoord }}"}' hx-target="#ChatList">
            <ul>
            {% for ChatName in Messages %}
                <li>
                    <form method=post action="/Admin/{{ ChatName }}">
                        <input type="hidden" name="Name" value="{{ naam }}">
                        <input type="hidden" name="Password" value="{{ wachtwoord }}">
                        <input type="hidden" name="ChatName" value="{{ ChatName }}">
                        <button type="submit">{{ ChatName }}</button>
                    </form>
                </li>
            {% endfor %}
            </ul>
        </div>
    </body>
</html>
