<!DOCTYPE html>
<html>
    <head>
        <title>Home</title>
        <link rel="stylesheet" href="/static/css/style.css">
        <script src="/static/js/htmx.min.js"></script>
        <script src="/static/js/app.js" defer></script>
    </head>
    <body>
        <h1>{{ChatName}}</h1>
        <div id="MessageBox" hx-post="/GetMessages" hx-trigger="every 2s, visibilitychange from:body" hx-vals='{"ChatName":"{{ChatName}}"}' hx-target="#MessageBox">
            {% include "Message.html" %}
        </div>
        <form hx-post="/Send" hx-target="#MessageBox">
            <input type="hidden" name="ChatName" value="{{ ChatName }}">
            <input type="text" name="Message" placeholder="Typ je bericht hier..." required>
            <button type="submit" class="ResetButton">Verstuur</button>
        </form>
        <br>
        <h3>Leden van deze chat:</h3>
        <div id="MembersBox" hx-post="/GetMembers" hx-trigger="every 2s, visibilitychange from:body" hx-vals='{"ChatName":"{{ChatName}}"}' hx-target="#MembersBox">
            <ul>
                {% for Member in Members %}
                    <li>{{ Member }}</li>
                {% endfor %}
            </ul>
        </div>
        <br>
        <form hx-post="/NewMember" hx-target="#MembersBox">
            <input type="hidden" name="ChatName" value="{{ ChatName }}">
            <input type="text" name="NewMember" placeholder="Voeg een nieuw lid toe..." required>
            <button type="submit" class="ResetButton">Voeg lid toe</button>
        </form>
    </body>
</html>
