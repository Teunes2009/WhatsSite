<!DOCTYPE html>
<html>
    <head>
        <title>Home</title>
        <link rel="stylesheet" href="/static/css/style.css">
        <script src="/static/js/htmx.min.js"></script>
    </head>
    <body>
        <nav>
            <a href="/">Home</a> | <a href="/about">Over Mij</a> | <a href="/project">Project</a>
        </nav>
        <h1>{{ChatName}}</h1>
        <div id="MessageBox" hx-get="/Chats/GetMessages" hx-target="0.5s" hx-vals='{"Chat":{{ChatName}}}'>
            {% if Messages %}
                {% for Message in Messages %}
                    <p>{{ Message.Name }}: {{ Message.Text }}</p>
                {% endfor %}
            {% else %}
                <h3>nog geen berichten.</h3>
            {% endif %}
        </div>
        <form hx-get="/Chats/send" hx-target="#MessageBox">
            <input type="hidden" name="Name" value="{{ Name }}">
            <input type="hidden" name="ChatName" value="{{ ChatName }}">
            <input type="text" name="Message" placeholder="Typ je bericht hier..." required>
            <button type="submit">Verstuur</button>
        </form>
    </body>
</html>
