<!DOCTYPE html>
<html>
    <head>
        <title>Home</title>
        <link rel="stylesheet" href="/static/css/style.css">
        <script src="/static/js/htmx.min.js"></script>
    </head>
    <body>
        <h1>{{ChatName}}</h1>
        <div id="MessageBox" hx-post="/GetMessages" hx-trigger="every 2s, visibilitychange from:body" hx-vals='{"ChatName":"{{ChatName}}", "Name":"{{Name}}", "Password":"{{Password}}"}' hx-target="#MessageBox">
            {% if Messages %}
                {% for Message in Messages %}
                    <p>{{ Message.Name }}: {{ Message.Text }}</p>
                {% endfor %}
            {% else %}
                <h3>U hebt nog geen chats.</h3>
            {% endif %}
        </div>
        <form hx-post="/Send" hx-target="#MessageBox">
            <input type="hidden" name="Name" value="{{ Name }}">
            <input type="hidden" name="Password" value="{{ Password }}">
            <input type="hidden" name="ChatName" value="{{ ChatName }}">
            <input type="text" name="Message" placeholder="Typ je bericht hier..." required>
            <button type="submit">Verstuur</button>
        </form>
        <br>
        <h3>Leden van deze chat:</h3>
        <div id="MembersBox" hx-post="/GetMembers" hx-trigger="every 2s, visibilitychange from:body" hx-vals='{"ChatName":"{{ChatName}}", "Name":"{{Name}}", "Password":"{{Password}}"}' hx-target="#MembersBox">
            <ul>
                {% for Member in Members %}
                    <li>{{ Member }}</li>
                {% endfor %}
            </ul>
        </div>
        <form hx-post="/NewMember" hx-target="#MembersBox">
            <input type="hidden" name="Name" value="{{ Name }}">
            <input type="hidden" name="Password" value="{{ Password }}">
            <input type="hidden" name="ChatName" value="{{ ChatName }}">
            <input type="text" name="NewMember" placeholder="Voeg een nieuw lid toe..." required>
            <button type="submit">Voeg lid toe</button>
        </form>
        {% if ChatName != "Main" %}
            <form method="post" action="/Leave">
                <input type="hidden" name="Name" value="{{ Name }}">
                <input type="hidden" name="Password" value="{{ Password }}">
                <input type="hidden" name="ChatName" value="{{ ChatName }}">
                <button type="submit">Verlaat Chat</button>
            </form>
        {% endif %}
    </body>
</html>
